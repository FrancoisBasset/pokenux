name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and Python distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/release.py check --allow-unreleased
      - name: Build and inspect wheel and source archive
        run: |
          uv build --out-dir dist/python
          uv run --frozen python scripts/check_dist.py dist/python/*
      - name: Install the wheel outside the checkout
        run: |
          uv venv --python 3.14.6 "$RUNNER_TEMP/pokenux-wheel"
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/pokenux-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/pokenux-wheel/bin/python" --no-deps dist/python/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pokenux-wheel/bin/pokenux" --version
          "$RUNNER_TEMP/pokenux-wheel/bin/pokenux" --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/python/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} packages
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist
      - name: Build portable runtime, Debian package and Arch recipe
        run: uv run --frozen --no-dev python scripts/build_linux.py --formats tar deb --output dist --skip-build
      - name: Install, check and remove on Debian and Ubuntu
        run: |
          for image in debian:bookworm-slim debian:trixie-slim ubuntu:22.04; do
            docker run --rm -v "$PWD/dist:/packages:ro" "$image" sh -ec '
              apt-get update -qq
              apt-get install -y --no-install-recommends /packages/pokenux_*.deb
              pokenux --version
              pokenux --check
              dpkg --remove pokenux
              test ! -e /usr/bin/pokenux
              test ! -d /opt/pokenux
            '
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*-linux-*.tar.gz
            dist/*-arch-recipe-*.tar.gz
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-x86_64
          path: dist
      - name: Build, install, check and remove with pacman
        run: |
          docker run --rm -v "$PWD/dist:/packages" archlinux:base-devel bash -euc '
            useradd -m builder
            install -d -o builder -g builder /build
            tar -xf /packages/*-arch-recipe-x86_64.tar.gz -C /build --strip-components=1
            cp /packages/*-linux-x86_64.tar.gz /build/
            chown -R builder:builder /build
            cd /build
            runuser -u builder -- makepkg --nodeps --noconfirm
            pacman -U --noconfirm ./*.pkg.tar.zst
            pokenux --version
            pokenux --check
            pacman -R --noconfirm pokenux
            test ! -e /usr/bin/pokenux
            test ! -d /opt/pokenux
            cp ./*.pkg.tar.zst /packages/
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
