name: Bug report
description: Report a reproducible problem in Pokénux.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md instead of opening a public issue."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, installation method, distribution, architecture, terminal, and terminal size. Review diagnostics for personal paths before sharing.
      placeholder: "Pokénux version, .deb / Arch / portable / source, Linux distribution, terminal..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the activity and relevant filters or settings.
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or diagnostic output
      description: Optional. Remove credentials, personal paths, and unrelated data.
